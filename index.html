<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Conferma Partecipazione Nozze</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      padding: 20px;
    }
    h1, h2 {
      color: #333;
    }
    label {
      margin-top: 10px;
      display: block;
    }
    input, select {
      padding: 10px;
      margin-top: 5px;
      width: 100%;
      box-sizing: border-box;
    }
    button {
      padding: 10px 20px;
      margin-top: 15px;
      background-color: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #45a049;
    }
    .error {
      color: red;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h1>Conferma Partecipazione</h1>

  <label for="nome">Nome:</label>
  <input type="text" id="nome" placeholder="Inserisci il nome">

  <label for="cognome">Cognome:</label>
  <input type="text" id="cognome" placeholder="Inserisci il cognome">

  <button onclick="verifica()">Verifica Partecipazione</button>

  <div id="gruppoSezione" style="display:none;">
    <h2>Gruppo Invitati</h2>
    <ul id="listaGruppo"></ul>

    <h3>Conferma partecipazione</h3>
    <div id="partecipazioneGruppo"></div>

    <button onclick="invia()">Invia Conferma</button>
  </div>

  <div id="errore" class="error" style="display:none;">Partecipante non trovato!</div>

  <script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwgzV9LDpJR_dOV9NLgGFFI7w5Vxt-0PSRxW2hXs8yMrLWmsyeq3IJHVjlLs3dpuiqg/exec';
    let gruppoCorrente = [];

    // Funzione per verificare la partecipazione
    function verifica() {
      const nome = document.getElementById('nome').value.trim();
      const cognome = document.getElementById('cognome').value.trim();

      if (!nome || !cognome) {
        alert("Inserisci nome e cognome.");
        return;
      }

      fetch(`${scriptURL}?nome=${encodeURIComponent(nome)}&cognome=${encodeURIComponent(cognome)}`)
        .then(r => r.json())
        .then(data => {
          if (data.trovato) {
            gruppoCorrente = data.gruppo;
            document.getElementById("errore").style.display = "none";
            document.getElementById("gruppoSezione").style.display = "block";

            // Mostra lista partecipanti
            const ul = document.getElementById("listaGruppo");
            ul.innerHTML = "";
            gruppoCorrente.forEach(p => {
              const li = document.createElement("li");
              li.textContent = `${p.nome} ${p.cognome}`;
              ul.appendChild(li);
            });

            // Crea un form per confermare partecipazione e inserire preferenze
            const partecipazioneDiv = document.getElementById("partecipazioneGruppo");
            partecipazioneDiv.innerHTML = "";
            gruppoCorrente.forEach(p => {
              const div = document.createElement("div");
              div.innerHTML = `
                <label for="partecipa_${p.nome}_${p.cognome}">${p.nome} ${p.cognome} parteciperà?</label>
                <select id="partecipa_${p.nome}_${p.cognome}">
                  <option value="si">Sì</option>
                  <option value="no">No</option>
                </select>
                <label for="preferenze_${p.nome}_${p.cognome}">Preferenze alimentari / intolleranze:</label>
                <input type="text" id="preferenze_${p.nome}_${p.cognome}" placeholder="Scrivi le preferenze..." />
              `;
              partecipazioneDiv.appendChild(div);
            });
          } else {
            document.getElementById("errore").style.display = "block";
            document.getElementById("gruppoSezione").style.display = "none";
          }
        })
        .catch(err => {
          console.error(err);
          alert("Errore di connessione al server.");
        });
    }

    // Funzione per inviare la conferma
    function invia() {
      const conferme = gruppoCorrente.map(p => {
        return {
          nome: p.nome,
          cognome: p.cognome,
          partecipa: document.getElementById(`partecipa_${p.nome}_${p.cognome}`).value === "si",
          preferenze: document.getElementById(`preferenze_${p.nome}_${p.cognome}`).value.trim()
        };
      });

      fetch(scriptURL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ conferme: conferme })
      })
        .then(r => r.json())
        .then(data => {
          alert(data.messaggio);
        })
        .catch(err => {
          console.error(err);
          alert("Errore nell'invio dei dati.");
        });
    }
  </script>

</body>
</html>
