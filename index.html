<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conferma Partecipazione</title>
  <style>
    body { font-family: Arial; background: #f4f4f4; padding: 20px; }
    input, select, button { display: block; margin: 10px 0; padding: 8px; width: 100%; max-width: 400px; }
    #gruppoInfo, #confermaForm { display: none; }
  </style>
</head>
<body>

<h1>Conferma Partecipazione</h1>

<input id="nome" placeholder="Nome" required>
<input id="cognome" placeholder="Cognome" required>
<button onclick="verifica()">Verifica Partecipazione</button>

<div id="errore" style="color: red; display: none;">Partecipante non trovato.</div>

<div id="gruppoInfo">
  <h2>Gruppo:</h2>
  <ul id="listaGruppo"></ul>
</div>

<div id="confermaForm">
  <label>Parteciperai?</label>
  <select id="partecipa">
    <option value="si">Sì</option>
    <option value="no">No</option>
  </select>
  <input id="preferenze" placeholder="Preferenze alimentari (facoltativo)">
  <button onclick="invia()">Invia Conferma</button>
</div>

<script>
const url = 'https://script.google.com/macros/s/AKfycbxsZm-FONLTOYGt3ZQ8Dv7mfwv4P41hMqQUcJ3k4hozLGyoqJfnnJlkDDOcOZoxcj44/exec';
let gruppoID = '';
let membriGruppo = [];

function verifica() {
  const nome = document.getElementById("nome").value.trim();
  const cognome = document.getElementById("cognome").value.trim();
  fetch(`${url}?nome=${encodeURIComponent(nome)}&cognome=${encodeURIComponent(cognome)}`)
    .then(r => r.json())
    .then(data => {
      if (!data.trovato) {
        document.getElementById("errore").style.display = "block";
        document.getElementById("gruppoInfo").style.display = "none";
        document.getElementById("confermaForm").style.display = "none";
        return;
      }
      document.getElementById("errore").style.display = "none";
      gruppoID = data.gruppo[0].gruppoID;
      membriGruppo = data.gruppo;
      const ul = document.getElementById("listaGruppo");
      ul.innerHTML = '';
      membriGruppo.forEach(m => {
        const li = document.createElement("li");
        li.textContent = `${m.nome} ${m.cognome}`;
        ul.appendChild(li);
      });
      document.getElementById("gruppoInfo").style.display = "block";
      document.getElementById("confermaForm").style.display = "block";
    });
}

function invia() {
  const partecipazione = document.getElementById("partecipa").value;
  const preferenze = document.getElementById("preferenze").value;
  const conferme = membriGruppo.map(m => ({
    nome: m.nome,
    cognome: m.cognome,
    partecipa: partecipazione === "si",
    preferenze: partecipazione === "si" ? preferenze : ""
  }));
  fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ gruppoID, conferme })
  })
  .then(r => r.json())
  .then(data => alert(data.messaggio))
  .catch(() => alert("Errore nell'invio."));
}
</script>
</body>
</html>
