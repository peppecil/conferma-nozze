html_content = """<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Conferma Nozze</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .hidden { display: none; }
    .persona { margin-bottom: 15px; border-bottom: 1px solid #ccc; padding: 10px 0; }
  </style>
</head>
<body>
  <h2>Conferma Partecipazione</h2>
  <p>Inserisci il tuo Nome e Cognome:</p>
  <input id="nome" placeholder="Nome"> <input id="cognome" placeholder="Cognome">
  <button onclick="cercaGruppo()">Cerca</button>

  <div id="gruppoArea" class="hidden">
    <h3>Gruppo trovato:</h3>
    <form id="moduloGruppo"></form>
    <button onclick="inviaConferma()">Invia Conferma</button>
  </div>

  <p id="messaggio"></p>

  <script>
    const scriptURL = "https://script.google.com/macros/s/AKfycbx2su4XdNQl--nlUTpuawXba-lzK8IgO9c5fOZxcPJ_EPaYdjws1Qf4YLAOkRybP9SA/exec"; // <-- Sostituisci con il tuo URL
    
    let gruppoID = "";
    let membri = [];

    function cercaGruppo() {
      const nome = document.getElementById("nome").value;
      const cognome = document.getElementById("cognome").value;
      fetch(`${scriptURL}?nome=${nome}&cognome=${cognome}`)
        .then(res => res.json())
        .then(data => {
          if (!data.trovato) {
            document.getElementById("messaggio").innerText = "Nome non trovato.";
            return;
          }
          if (data.confermato) {
            document.getElementById("messaggio").innerText = "Modulo già inviato per questo gruppo.";
            return;
          }

          membri = data.gruppo;
          gruppoID = membri[0].gruppoID;
          const form = document.getElementById("moduloGruppo");
          form.innerHTML = "";

          membri.forEach((persona, index) => {
            form.innerHTML += `
              <div class="persona">
                <strong>${persona.nome} ${persona.cognome}</strong><br>
                Partecipa? 
                <select id="partecipa${index}" onchange="togglePreferenze(${index})">
                  <option value="sì">Sì</option>
                  <option value="no">No</option>
                </select><br>
                <div id="preferenze${index}">
                  Preferenze o intolleranze: <input id="note${index}" placeholder="Es. senza glutine">
                </div>
              </div>
            `;
          });
          document.getElementById("gruppoArea").classList.remove("hidden");
          document.getElementById("messaggio").innerText = "";
        });
    }

    function togglePreferenze(index) {
      const val = document.getElementById(`partecipa${index}`).value;
      document.getElementById(`preferenze${index}`).style.display = val === "sì" ? "block" : "none";
    }

    function inviaConferma() {
      const conferme = membri.map((persona, index) => ({
        nome: persona.nome,
        cognome: persona.cognome,
        partecipa: document.getElementById(`partecipa${index}`).value === "sì",
        preferenze: document.getElementById(`note${index}`).value
      }));

      fetch(scriptURL, {
        method: "POST",
        body: JSON.stringify({
          gruppoID: conferme[0].gruppoID,
          conferme
        }),
        headers: {
          "Content-Type": "application/json"
        }
      }).then(res => res.json())
        .then(data => {
          document.getElementById("messaggio").innerText = data.messaggio;
          if (data.successo) {
            document.getElementById("gruppoArea").classList.add("hidden");
          }
        });
    }
  </script>
</body>
</html>
