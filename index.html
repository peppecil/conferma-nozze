<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Conferma Partecipazione</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: auto; padding: 20px; }
    input, select, button { display: block; width: 100%; margin-bottom: 10px; padding: 10px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>Conferma Partecipazione alle Nozze</h1>

  <input id="nome" placeholder="Nome">
  <input id="cognome" placeholder="Cognome">
  <button onclick="verifica()">Verifica</button>

  <div id="gruppo" class="hidden">
    <h2>Gruppo Trovato</h2>
    <ul id="lista"></ul>
    <div id="scelte"></div>
    <button onclick="invia()">Invia Conferma</button>
  </div>

  <p id="errore" style="color:red;"></p>

  <script>
    const URL = 'https://script.google.com/macros/s/AKfycbxGIROEKkkEaepO0Akr5MRFPLYdknTxt6GELo05LVQbCoLMyJGtpYf-VB92-baCs6cQ/exec';
    let gruppoID = '';
    let membri = [];

    function verifica() {
      const nome = document.getElementById('nome').value.trim();
      const cognome = document.getElementById('cognome').value.trim();
      fetch(`${URL}?nome=${nome}&cognome=${cognome}`)
        .then(r => r.json())
        .then(data => {
          if (!data.trovato) {
            document.getElementById('errore').textContent = "Partecipante non trovato!";
            return;
          }
          document.getElementById('errore').textContent = "";
          gruppoID = data.gruppoID;
          membri = data.gruppo;
          document.getElementById('gruppo').classList.remove('hidden');
          document.getElementById('lista').innerHTML = membri.map(m => `<li>${m.nome} ${m.cognome}</li>`).join("");
          const scelteDiv = document.getElementById('scelte');
          scelteDiv.innerHTML = membri.map((m, i) => `
            <div>
              <label><b>${m.nome} ${m.cognome}</b></label>
              <select id="partecipa${i}">
                <option value="no">No</option>
                <option value="si">Sì</option>
              </select>
              <input id="preferenze${i}" placeholder="Preferenze alimentari (opzionale)">
            </div>
          `).join("");
        });
    }

    function invia() {
      const conferme = membri.map((m, i) => ({
        nome: m.nome,
        cognome: m.cognome,
        partecipa: document.getElementById(`partecipa${i}`).value === 'si',
        preferenze: document.getElementById(`preferenze${i}`).value.trim()
      }));

      fetch(URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ gruppoID, conferme })
      })
      .then(r => r.json())
      .then(data => alert(data.messaggio))
      .catch(() => alert("Errore nell'invio!"));
    }
  </script>
</body>
</html>
